name: build-and-test

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: dotnet restore EthioFleet.slnx
      - run: dotnet build EthioFleet.slnx --no-restore --configuration Release
      - run: dotnet test backend/EthioFleet.Tests/EthioFleet.Tests.csproj --no-restore --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/ethiofleet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/ethiofleet/package-lock.json
      - run: npm ci
      - run: npm run build
